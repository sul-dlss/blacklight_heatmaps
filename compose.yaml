services:
  solr:
    image: "solr:${SOLR_VERSION:-latest}"
    environment:
      - SOLR_MODULES=analysis-extras
    volumes:
      - ./solr/conf:/opt/solr/conf:ro
    ports:
      - "8983:8983"
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - blacklight-core
      - /opt/solr/conf
